<video class="background-video" autoplay muted loop playsinline>
    <source src="Video/bacground.mp4" type="video/mp4">
</video>

<div class="music-player">

    <button id="musicButton" type="button">
        ▶
    </button>

    <div class="music-info">
        <span id="musicTitle">Our Song</span>
        <small id="musicStatus">Klik untuk memutar</small>
    </div>

    <div class="music-volume">
        <span>🔊</span>

        <input
            type="range"
            id="volumeControl"
            min="0"
            max="1"
            step="0.01"
            value="0.7"
        >
    </div>

    <audio id="music" loop preload="auto">
        <source src="musik/lagu.mp3" type="audio/mpeg">
    </audio>

</div>

<div class="gif-sticker">
    <img src="gif/gif-gifkk.gif" alt="GIF romantis">
</div>


<section class="final-section section" id="final">

    <div class="final-card">

        <div class="final-heart">
            ♡
        </div>

        <span class="gold-label">
            ONE LAST QUESTION
        </span>

        <h2>
            Ada satu hal lagi
            yang ingin aku tanyakan...
        </h2>

        <p>
            Setelah semua cerita kecil yang ada di halaman ini,
            aku cuma ingin tahu satu hal.
        </p>

        <div class="question-box">
            Kamu mau gak kita membuat
            lebih banyak cerita bersama?
        </div>

        <div class="final-buttons">

            <button id="yesButton" class="yes-button">
                💗 Mau!
            </button>

            <button id="noButton" class="no-button">
                Pikir-pikir Dulu
            </button>

        </div>

        <div id="finalMessage"></div>

        <div class="answer-box" id="answerBox">
            Jawaban kamu akan muncul di sini ♡
        </div>

    </div>

</section>
